name: Phase 2 Win32 Build

on:
  workflow_dispatch:
  push:
    branches:
      - modernization
    paths:
      - '.github/workflows/phase2-win32-build.yml'
      - 'SRCMainGS/Source/Main5.2/**'

permissions:
  contents: read

concurrency:
  group: phase2-win32-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-main-x86:
    name: Main Release + Debug x86 + Diligent OpenGL
    # Both Main configurations are required to stay buildable. Debug is
    # normalized to C++17 by source/Directory.Build.targets because the
    # vendored sol2 headers already require C++17.
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout modernization
        uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Show toolchain
        shell: powershell
        run: |
          git --version
          cmake --version
          msbuild -version

      - name: Preflight PowerShell scripts
        shell: powershell
        working-directory: SRCMainGS/Source/Main5.2
        run: |
          $scripts = @(
            '.\setup_diligent_opengl46.ps1',
            '.\run_phase2_runtime_test.ps1'
          )

          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw ("PowerShell syntax preflight failed for {0}" -f $script)
            }

            Write-Host ("[Phase2 CI] PowerShell syntax OK: {0}" -f $script)
          }

      - name: Prepare pinned Diligent OpenGL backends
        shell: powershell
        working-directory: SRCMainGS/Source/Main5.2
        run: |
          .\setup_diligent_opengl46.ps1

      - name: Build Main Release x86
        shell: powershell
        working-directory: SRCMainGS/Source/Main5.2
        run: |
          msbuild .\Main.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Verify Release outputs
        shell: powershell
        run: |
          $client = Join-Path $PWD 'Client_2'
          $required = @(
            (Join-Path $client 'GraphicsEngineOpenGL_32r.dll'),
            (Join-Path $client 'GraphicsEngineOpenGL_32d.dll'),
            (Join-Path $client 'Main.exe')
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Expected Phase 2 Release output was not produced: $path"
            }
            Write-Host "[Phase2 CI][Release] Found $path"
          }

      - name: Build Main Debug x86
        shell: powershell
        working-directory: SRCMainGS/Source/Main5.2
        run: |
          msbuild .\Main.sln /m /p:Configuration=Debug /p:Platform=x86

      - name: Verify Debug outputs
        shell: powershell
        run: |
          $client = Join-Path $PWD 'Client_2'
          $required = @(
            (Join-Path $client 'GraphicsEngineOpenGL_32r.dll'),
            (Join-Path $client 'GraphicsEngineOpenGL_32d.dll'),
            (Join-Path $client 'Main.exe')
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Expected Phase 2 Debug output was not produced: $path"
            }
            Write-Host "[Phase2 CI][Debug] Found $path"
          }

      - name: Validate runtime evidence script
        shell: powershell
        working-directory: SRCMainGS/Source/Main5.2
        run: |
          $logPath = Join-Path $env:GITHUB_WORKSPACE 'Client_2\ModernGraphics.log'
          @(
            '[ModernGraphics] Phase 2 OpenGL 4.6 attach attempt started.'
            '[ModernGraphics] OpenGL vendor=CI | renderer=CI | version=4.6 | GLSL=4.60 | parsed=4.6 | profile=compatibility.'
            '[ModernGraphics] Diligent validation/OpenGL debug routing enabled by MU_MODERN_GL_DEBUG.'
            '[ModernGraphics] Diligent attached to the existing OpenGL 4.6 context; legacy SwapBuffers remains authoritative.'
            '[ModernGraphics] Resize observed: 1280x720. Presentation remains legacy-owned.'
            '[ModernGraphics] Teardown barrier armed for the attached WGL context.'
            '[ModernGraphics] Shutdown completed before legacy WGL teardown.'
          ) | Set-Content -Path $logPath -Encoding ASCII

          .\run_phase2_runtime_test.ps1 -ValidateOnly -EnableGLDebug -RequireResize
