name: Phase 2 Win32 Build

on:
  workflow_dispatch:
  push:
    branches:
      - modernization
    paths:
      - '.github/workflows/phase2-win32-build.yml'
      - 'SRCMainGS/Source/Main5.2/**'

permissions:
  contents: read

concurrency:
  group: phase2-win32-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-bmd-geometry:
    name: Phase 3 BMD geometry CPU tests (x86)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Configure geometry tests
        run: cmake -S SRCMainGS/Source/Main5.2/tests -B build-bmd-tests -A Win32
      - name: Build geometry tests
        run: cmake --build build-bmd-tests --config Release
      - name: Run geometry tests
        run: ctest --test-dir build-bmd-tests -C Release --output-on-failure

  build-main-x86:
    name: Main Release + Debug x86 + Diligent OpenGL
    # Both Main configurations are required to stay buildable. Debug is
    # normalized to C++17 by source/Directory.Build.targets because the
    # vendored sol2 headers already require C++17.
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout modernization
        uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Show toolchain
        shell: powershell
        run: |
          git --version
          cmake --version
          msbuild -version

      - name: Preflight PowerShell scripts
        shell: powershell
        working-directory: SRCMainGS/Source/Main5.2
        run: |
          $scripts = @(
            '.\setup_diligent_opengl46.ps1',
            '.\run_phase2_runtime_test.ps1'
          )

          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw ("PowerShell syntax preflight failed for {0}" -f $script)
            }

            Write-Host ("[Phase2 CI] PowerShell syntax OK: {0}" -f $script)
          }

      - name: Prepare pinned Diligent OpenGL backends
        shell: powershell
        working-directory: SRCMainGS/Source/Main5.2
        run: |
          .\setup_diligent_opengl46.ps1

      - name: Build Main Release x86
        shell: powershell
        working-directory: SRCMainGS/Source/Main5.2
        run: |
          msbuild .\Main.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Verify Release outputs
        shell: powershell
        run: |
          $client = Join-Path $PWD 'Client_2'
          $required = @(
            (Join-Path $client 'GraphicsEngineOpenGL_32r.dll'),
            (Join-Path $client 'GraphicsEngineOpenGL_32d.dll'),
            (Join-Path $client 'Main.exe')
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Expected Phase 2 Release output was not produced: $path"
            }
            Write-Host "[Phase2 CI][Release] Found $path"
          }

      - name: Build Main Debug x86
        shell: powershell
        working-directory: SRCMainGS/Source/Main5.2
        run: |
          msbuild .\Main.sln /m /p:Configuration=Debug /p:Platform=x86

      - name: Verify Debug outputs
        shell: powershell
        run: |
          $client = Join-Path $PWD 'Client_2'
          $required = @(
            (Join-Path $client 'GraphicsEngineOpenGL_32r.dll'),
            (Join-Path $client 'GraphicsEngineOpenGL_32d.dll'),
            (Join-Path $client 'Main.exe')
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Expected Phase 2 Debug output was not produced: $path"
            }
            Write-Host "[Phase2 CI][Debug] Found $path"
          }

      - name: Validate runtime evidence parser
        shell: powershell
        working-directory: SRCMainGS/Source/Main5.2
        run: |
          $logPath = Join-Path $env:GITHUB_WORKSPACE 'Client_2\ModernGraphics.log'

          # Positive lifecycle: attach -> diagnostics -> debug -> attached -> resize
          # -> teardown barrier -> shutdown.
          @(
            '[ModernGraphics] Phase 2 OpenGL 4.6 attach attempt started.'
            '[ModernGraphics] OpenGL vendor=CI | renderer=CI | version=4.6 | GLSL=4.60 | parsed=4.6 | profile=compatibility.'
            '[ModernGraphics] Diligent validation/OpenGL debug routing enabled by MU_MODERN_GL_DEBUG.'
            '[ModernGraphics] Diligent attached to the existing OpenGL 4.6 context; legacy SwapBuffers remains authoritative.'
            '[ModernGraphics] Resize observed: 1280x720. Presentation remains legacy-owned.'
            '[ModernGraphics] Teardown barrier armed for the attached WGL context.'
            '[ModernGraphics] Shutdown completed before legacy WGL teardown.'
          ) | Set-Content -Path $logPath -Encoding ASCII

          .\run_phase2_runtime_test.ps1 -ValidateOnly -EnableGLDebug -RequireResize

          # Positive recreation: a genuinely recreated HWND/HGLRC is allowed to
          # start a second lifecycle, but only after the first shutdown is complete.
          @(
            '[ModernGraphics] Phase 2 OpenGL 4.6 attach attempt started.'
            '[ModernGraphics] OpenGL vendor=CI | renderer=CI | version=4.6 | GLSL=4.60 | parsed=4.6 | profile=compatibility.'
            '[ModernGraphics] Diligent validation/OpenGL debug routing enabled by MU_MODERN_GL_DEBUG.'
            '[ModernGraphics] Diligent attached to the existing OpenGL 4.6 context; legacy SwapBuffers remains authoritative.'
            '[ModernGraphics] Resize observed: 1280x720. Presentation remains legacy-owned.'
            '[ModernGraphics] Teardown barrier armed for the attached WGL context.'
            '[ModernGraphics] Shutdown completed before legacy WGL teardown.'
            '[ModernGraphics] Phase 2 OpenGL 4.6 attach attempt started.'
            '[ModernGraphics] OpenGL vendor=CI2 | renderer=CI2 | version=4.6 | GLSL=4.60 | parsed=4.6 | profile=compatibility.'
            '[ModernGraphics] Diligent validation/OpenGL debug routing enabled by MU_MODERN_GL_DEBUG.'
            '[ModernGraphics] Diligent attached to the existing OpenGL 4.6 context; legacy SwapBuffers remains authoritative.'
            '[ModernGraphics] Resize observed: 1600x900. Presentation remains legacy-owned.'
            '[ModernGraphics] Teardown barrier armed for the attached WGL context.'
            '[ModernGraphics] Shutdown completed before legacy WGL teardown.'
          ) | Set-Content -Path $logPath -Encoding ASCII

          .\run_phase2_runtime_test.ps1 -ValidateOnly -EnableGLDebug -RequireResize

          # Negative lifecycle: shutdown before teardown must be rejected.
          @(
            '[ModernGraphics] Phase 2 OpenGL 4.6 attach attempt started.'
            '[ModernGraphics] OpenGL vendor=CI | renderer=CI | version=4.6 | GLSL=4.60 | parsed=4.6 | profile=compatibility.'
            '[ModernGraphics] Diligent validation/OpenGL debug routing enabled by MU_MODERN_GL_DEBUG.'
            '[ModernGraphics] Diligent attached to the existing OpenGL 4.6 context; legacy SwapBuffers remains authoritative.'
            '[ModernGraphics] Resize observed: 1280x720. Presentation remains legacy-owned.'
            '[ModernGraphics] Shutdown completed before legacy WGL teardown.'
            '[ModernGraphics] Teardown barrier armed for the attached WGL context.'
          ) | Set-Content -Path $logPath -Encoding ASCII

          $reorderedRejected = $false
          try {
            .\run_phase2_runtime_test.ps1 -ValidateOnly -EnableGLDebug -RequireResize
          }
          catch {
            $reorderedRejected = $true
            Write-Host "[Phase2 CI] PASS: reordered teardown/shutdown evidence was rejected: $($_.Exception.Message)"
          }
          if (-not $reorderedRejected) {
            throw 'Runtime evidence parser accepted shutdown-before-teardown evidence.'
          }

          # Negative lifecycle: a new attach attempt while teardown is armed but
          # before the matching shutdown must be rejected.
          @(
            '[ModernGraphics] Phase 2 OpenGL 4.6 attach attempt started.'
            '[ModernGraphics] OpenGL vendor=CI | renderer=CI | version=4.6 | GLSL=4.60 | parsed=4.6 | profile=compatibility.'
            '[ModernGraphics] Diligent validation/OpenGL debug routing enabled by MU_MODERN_GL_DEBUG.'
            '[ModernGraphics] Diligent attached to the existing OpenGL 4.6 context; legacy SwapBuffers remains authoritative.'
            '[ModernGraphics] Resize observed: 1280x720. Presentation remains legacy-owned.'
            '[ModernGraphics] Teardown barrier armed for the attached WGL context.'
            '[ModernGraphics] Phase 2 OpenGL 4.6 attach attempt started.'
            '[ModernGraphics] Shutdown completed before legacy WGL teardown.'
          ) | Set-Content -Path $logPath -Encoding ASCII

          $midTeardownAttachRejected = $false
          try {
            .\run_phase2_runtime_test.ps1 -ValidateOnly -EnableGLDebug -RequireResize
          }
          catch {
            $midTeardownAttachRejected = $true
            Write-Host "[Phase2 CI] PASS: attach during teardown was rejected: $($_.Exception.Message)"
          }
          if (-not $midTeardownAttachRejected) {
            throw 'Runtime evidence parser accepted an attach attempt while teardown was still in progress.'
          }

          # Negative lifecycle: a second lifecycle that starts but never reaches
          # diagnostics/attachment/teardown/shutdown must be rejected as incomplete.
          @(
            '[ModernGraphics] Phase 2 OpenGL 4.6 attach attempt started.'
            '[ModernGraphics] OpenGL vendor=CI | renderer=CI | version=4.6 | GLSL=4.60 | parsed=4.6 | profile=compatibility.'
            '[ModernGraphics] Diligent validation/OpenGL debug routing enabled by MU_MODERN_GL_DEBUG.'
            '[ModernGraphics] Diligent attached to the existing OpenGL 4.6 context; legacy SwapBuffers remains authoritative.'
            '[ModernGraphics] Resize observed: 1280x720. Presentation remains legacy-owned.'
            '[ModernGraphics] Teardown barrier armed for the attached WGL context.'
            '[ModernGraphics] Shutdown completed before legacy WGL teardown.'
            '[ModernGraphics] Phase 2 OpenGL 4.6 attach attempt started.'
          ) | Set-Content -Path $logPath -Encoding ASCII

          $partialCycleRejected = $false
          try {
            .\run_phase2_runtime_test.ps1 -ValidateOnly -EnableGLDebug -RequireResize
          }
          catch {
            $partialCycleRejected = $true
            Write-Host "[Phase2 CI] PASS: incomplete recreated lifecycle was rejected: $($_.Exception.Message)"
          }
          if (-not $partialCycleRejected) {
            throw 'Runtime evidence parser accepted an incomplete recreated lifecycle.'
          }

          # Negative lifecycle: every recreated lifecycle must independently
          # report the compatibility profile. A compatibility first cycle cannot
          # make a later core-profile cycle look valid.
          @(
            '[ModernGraphics] Phase 2 OpenGL 4.6 attach attempt started.'
            '[ModernGraphics] OpenGL vendor=CI | renderer=CI | version=4.6 | GLSL=4.60 | parsed=4.6 | profile=compatibility.'
            '[ModernGraphics] Diligent validation/OpenGL debug routing enabled by MU_MODERN_GL_DEBUG.'
            '[ModernGraphics] Diligent attached to the existing OpenGL 4.6 context; legacy SwapBuffers remains authoritative.'
            '[ModernGraphics] Resize observed: 1280x720. Presentation remains legacy-owned.'
            '[ModernGraphics] Teardown barrier armed for the attached WGL context.'
            '[ModernGraphics] Shutdown completed before legacy WGL teardown.'
            '[ModernGraphics] Phase 2 OpenGL 4.6 attach attempt started.'
            '[ModernGraphics] OpenGL vendor=CI2 | renderer=CI2 | version=4.6 | GLSL=4.60 | parsed=4.6 | profile=core.'
            '[ModernGraphics] Diligent validation/OpenGL debug routing enabled by MU_MODERN_GL_DEBUG.'
            '[ModernGraphics] Diligent attached to the existing OpenGL 4.6 context; legacy SwapBuffers remains authoritative.'
            '[ModernGraphics] Resize observed: 1600x900. Presentation remains legacy-owned.'
            '[ModernGraphics] Teardown barrier armed for the attached WGL context.'
            '[ModernGraphics] Shutdown completed before legacy WGL teardown.'
          ) | Set-Content -Path $logPath -Encoding ASCII

          $mixedProfileRejected = $false
          try {
            .\run_phase2_runtime_test.ps1 -ValidateOnly -EnableGLDebug -RequireResize
          }
          catch {
            $mixedProfileRejected = $true
            Write-Host "[Phase2 CI] PASS: mixed compatibility/core lifecycle evidence was rejected: $($_.Exception.Message)"
          }
          if (-not $mixedProfileRejected) {
            throw 'Runtime evidence parser accepted a recreated lifecycle without compatibility-profile evidence.'
          }

      - name: Publish Phase 2 GPU runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: phase2-win32-gpu-runtime-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            Client_2/Main.exe
            Client_2/GraphicsEngineOpenGL_32r.dll
            Client_2/GraphicsEngineOpenGL_32d.dll
            SRCMainGS/Source/Main5.2/run_phase2_runtime_test.ps1
